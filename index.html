<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>devChallenges.io | Minimal Blog Card</title>

    <!--You are welcome to delete these styles or modify them in your own stylesheet -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color:aliceblue
      }

      body {
        height: 100vh;
      }

      .author-info {
        font-size: 14px;
        text-align: center;
        margin-top: 16px;
        color: rgb(55, 65, 81);
      }

      .author-info a {
        text-decoration: none;
      }
      img{
        margin: 16px;
        border-radius: 3%;
      }
      span{
        margin: 16px;
        padding: 4px 10px;
        color: rgb(91, 23, 175);
        background-color: rgb(253, 240, 253);
        border-radius: 40%;
      }
      .title{
        margin: 16px 16px 6px 16px;
        font-family: "Open Sans", sans-serif;
        font-weight: 700;
      }
      p{
        margin-left: 16px;
        margin-bottom: 20px;
        font-weight: 100;
        font-family: "Open Sans", sans-serif;
        font-size: smaller;
        width: 336px;
      }
      .name{
        margin: 20px 0 20px 16px;
       
      }
      .container{
        width: fit-content;
        margin: auto;
        position: relative;
        top: 25%;
        padding: 20px;
        border-radius: 20px;
       box-shadow: 15px 15px 20px 15px rgba(33, 24, 162, 0.08);
      }
      .container,p,.title{
      background-color: aliceblue;
       }
    </style>
  </head>
  <body>
   

    <div class="author-info">
      Coded by <a href="#">Your Name Here</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>

    <div class="container">
      <img style="display: block;" src="./resources/Cactus.jpg" alt="cactus" />
      <span>Design </span>
      <p class="title">Embracing Minimalism</p>
      <p>
        From minimalist sculptures to minimalist paintings, this blog will
        inspire you to appreciate the beauty that lies in simplicity. 
        <p class="name"> Annie
        Spratt</p>
      </p>
    </div>
  </body>
</html>
